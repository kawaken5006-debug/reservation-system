  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0,0,0,0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #f5f5f5;
      padding: 20px;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
      background: #f8f9fa;
    }

    .nav-btn {
      padding: 10px 20px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      min-height: 44px;
      touch-action: manipulation;
    }

    .nav-btn:hover {
      background: #f0f0f0;
    }

    .nav-btn:active {
      background: #e0e0e0;
    }

    .month-title {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    .table-wrapper {
      overflow-x: auto;
      padding: 20px;
    }

    .calendar-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    .calendar-table th {
      background: #f8f9fa;
      padding: 12px 8px;
      font-size: 12px;
      border: 1px solid #ddd;
      text-align: center;
    }

    .calendar-table td {
      padding: 12px 8px;
      border: 1px solid #ddd;
      text-align: center;
      font-size: 14px;
    }

    .calendar-table td.time-col {
      background: #f8f9fa;
      font-weight: bold;
      font-size: 13px;
      width: 80px;
    }

    .date-header {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .date-num {
      font-size: 16px;
      display: block;
    }

    .date-day {
      font-size: 11px;
      color: #666;
    }

    .date-day.sat {
      color: #2196F3;
    }

    .date-day.sun {
      color: #f44336;
    }

    .slot {
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
      transition: all 0.2s;
      display: inline-block;
      min-width: 30px;
    }

    .slot.available {
      color: #FF1493;
    }

    .slot.available:hover {
      background: #fff0f5;
      transform: scale(1.2);
      border-radius: 4px;
    }

    .slot.full {
      color: #999;
      cursor: not-allowed;
    }

    .slot.closed {
      color: #ddd;
    }

    .slot.selected {
      background: #667eea;
      color: white;
      border-radius: 4px;
      transform: scale(1.2);
    }

    .booking-form {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 30px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 1000;
      display: none;
    }

    .booking-form.active {
      display: block;
    }
    
    .booking-form::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: -1;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      max-width: 500px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .button-group {
      display: flex;
      gap: 10px;
    }

    .submit-btn {
      background: #667eea;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .submit-btn:hover {
      background: #5568d3;
    }

    .cancel-btn {
      background: #999;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .cancel-btn:hover {
      background: #777;
    }

    .selected-info {
      background: #fff3e0;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      border-left: 4px solid #ff9800;
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .container {
        border-radius: 8px;
      }

      .header h1 {
        font-size: 20px;
      }

      .header p {
        font-size: 13px;
      }

      .nav-buttons {
        flex-direction: column;
        gap: 10px;
        padding: 15px;
      }

      .nav-btn {
        width: 100%;
        padding: 12px;
        font-size: 16px;
      }

      .month-title {
        font-size: 18px;
      }

      .table-wrapper {
        padding: 10px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .calendar-table {
        font-size: 11px;
        min-width: 600px;
      }

      .calendar-table th,
      .calendar-table td {
        padding: 8px 4px;
      }

      .calendar-table td.time-col {
        font-size: 12px;
        width: 60px;
      }

      .date-num {
        font-size: 14px;
      }

      .date-day {
        font-size: 10px;
      }

      .slot {
        font-size: 20px;
        min-width: 25px;
        padding: 6px;
      }

      .booking-form {
        width: 95%;
        max-width: none;
        padding: 20px;
        max-height: 85vh;
      }

      .booking-form h2 {
        font-size: 20px;
      }

      .form-group label {
        font-size: 14px;
      }

      .form-group input,
      .form-group select {
        font-size: 16px;
      }

      .button-group {
        flex-direction: column;
        gap: 10px;
      }

      .submit-btn,
      .cancel-btn {
        width: 100%;
        padding: 14px;
        font-size: 16px;
      }

      .selected-info {
        font-size: 14px;
      }
    }

    @media (min-width: 769px) and (max-width: 1024px) {
      .container {
        max-width: 100%;
      }

      .table-wrapper {
        padding: 15px;
      }

      .calendar-table {
        font-size: 13px;
      }

      .slot {
        font-size: 22px;
      }

      .booking-form {
        max-width: 600px;
      }
    }

    @media (max-width: 768px) and (orientation: landscape) {
      .booking-form {
        max-height: 90vh;
        padding: 15px;
      }

      .header {
        padding: 15px;
      }

      .nav-buttons {
        padding: 10px;
      }
    }
  </style>

  <script type="text/babel">
    // ===== メール認証機能 =====
    const EMAIL_API_URL = 'https://script.google.com/macros/s/AKfycbxeqlUuIsseTi2L5WmqMec41eWQXJ5z_jihteUa69-S3sKfVXgvw0wSiLaBdAfAozn6TQ/exec';

    // トークン生成関数
    function generateVerificationToken() {
      return Math.random().toString(36).substring(2, 15) + 
             Math.random().toString(36).substring(2, 15) + 
             Date.now().toString(36);
    }

    // メール送信関数
    async function sendVerificationEmail(email, customerId, token, name) {
      try {
        const response = await fetch(EMAIL_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            action: 'send_verification',
            email: email,
            customerId: customerId,
            token: token,
            name: name
          })
        });
        
        console.log('✅ 認証メール送信完了:', email);
        return true;
      } catch (error) {
        console.error('❌ メール送信エラー:', error);
        return false;
      }
    }
    // ===== メール認証機能ここまで =====
    
    const BUSINESS_HOURS = {
      weekday: [
        '9:00', '9:45', '10:30', '11:15', '11:45',
        '15:00', '15:45', '16:30', '17:15', '18:00', '18:45', '19:30'
      ],
      saturday: [
        '9:00', '9:45', '10:30', '11:15', '11:45',
        '15:00', '15:45', '16:30', '17:15', '18:00', '18:30'
      ],
      sunday: [
        '8:30', '9:15', '10:00', '10:45', '11:30', '12:15',
        '13:00', '13:45', '14:30', '15:15', '16:00'
      ]
    };

    const TREATMENT_MENUS = [
      { id: 'new_patient_body', name: '新規（初回）- 身体の施術', duration: 90, isNewPatient: true },
      { id: 'new_patient_facial', name: '新規（初回）- 美容鍼', duration: 90, isNewPatient: true },
      { id: 'insurance', name: '保険のみの施術（自費矯正も含む）', duration: 45 },
      { id: 'raku', name: '保険と自費（楽トレありの方）', duration: 45 },
      { id: 'facial', name: '美容鍼', duration: 45 }
    ];

    const MAX_SLOTS = {
      '8:30': 11, '9:00': 11, '9:15': 11, '9:45': 11, '10:00': 11, '10:30': 11,
      '10:45': 11, '11:15': 11, '11:30': 11, '11:45': 11, '12:15': 11, '12:30': 5,
      '13:00': 11, '13:45': 11, '14:30': 11, '15:00': 11, '15:15': 11, '15:45': 11,
      '16:00': 11, '16:30': 11, '17:15': 11, '18:00': 11, '18:30': 11, '18:45': 11, '19:30': 11
    };

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getDayOfWeek(date) {
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      return days[date.getDay()];
    }


    const AvailabilityTable = () => {
      // 🔐 マイページからの自動ログイン処理
      React.useEffect(() => {
        console.log('🔵 useEffect実行');
        console.log('🔍 URL:', window.location.href);
        
        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('customerId');
        const autoLogin = urlParams.get('autoLogin');
        
        console.log('🔍 customerId:', customerId);
        console.log('🔍 autoLogin:', autoLogin);
        
        if (autoLogin === 'true' && customerId) {
          console.log('🔐 マイページから自動ログイン: ID', customerId);
          
          (async () => {
            try {
              console.log('🔵 Firestoreから顧客データ取得開始:', customerId);
              const customerDoc = await db.collection('customers').doc(customerId).get();
              
              console.log('🔍 customerDoc.exists:', customerDoc.exists);
              console.log('🔍 customerDoc:', customerDoc);
              
              if (customerDoc.exists) {
                const customer = customerDoc.data();
                
                console.log('🔍 customer:', customer);
                
                setFormData({
                  customerId: customerId,
                  password: '',
                  name: customer.name,
                  phone: customer.phone,
                  email: customer.email || '',
                  treatment: ''
                });
                
                setLoginChoice('existing');
                
                console.log('✅ 自動ログイン完了:', customer.name);
                console.log('💡 時間枠を選択してください');
                
                const cleanUrl = window.location.origin + window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
              } else {
                console.error('❌ 顧客が見つかりません:', customerId);
              }
            } catch (error) {
              console.error('❌ 自動ログインエラー:', error);
              console.error('❌ エラー詳細:', error.message);
              console.error('❌ エラースタック:', error.stack);
              console.error('❌ 顧客ID:', customerId);
            }
          })();
        } else {
          console.log('⚠️ 自動ログインの条件を満たしていません');
          console.log('⚠️ autoLogin:', autoLogin);
          console.log('⚠️ customerId:', customerId);
        }
      }, []);

      const [currentDate, setCurrentDate] = React.useState(new Date());
      const [selectedSlot, setSelectedSlot] = React.useState(null);
      const [showForm, setShowForm] = React.useState(false);
      const [showLoginStep, setShowLoginStep] = React.useState(false);
      const [loginChoice, setLoginChoice] = React.useState(null);
      const [showLoginForm, setShowLoginForm] = React.useState(false);
      const [showPasswordSetup, setShowPasswordSetup] = React.useState(false);
      const [passwordConfirm, setPasswordConfirm] = React.useState('');
      const [verificationMethod, setVerificationMethod] = React.useState('email');
      const [verificationSent, setVerificationSent] = React.useState(false);
      const [existingBookings, setExistingBookings] = React.useState({});
      const [formData, setFormData] = React.useState({
        customerId: '',
        password: '',
        name: '',
        phone: '',
        email: '',
        treatment: ''
      });

      React.useEffect(() => {
        const loadBookings = async () => {
          try {
            console.log('🔵 予約データ読み込み開始');
            
            const reservationsSnapshot = await db.collection('reservations').get();
            const allReservations = {};
            reservationsSnapshot.forEach(doc => {
              allReservations[doc.id] = doc.data();
            });
            
            const webBookingsSnapshot = await db.collection('webBookings').get();
            const webBookings = [];
            webBookingsSnapshot.forEach(doc => {
              webBookings.push(doc.data());
            });
            
            console.log('📊 reservations件数:', reservationsSnapshot.size);
            console.log('📊 webBookings件数:', webBookingsSnapshot.size);
            
            const bookingsByDate = {};
            
            Object.keys(allReservations).forEach(dateKey => {
              const dateData = allReservations[dateKey];
              if (!dateData || !dateData.data) return;
              
              const bookings = [];
              const data = dateData.data;
              
              Object.keys(data).forEach(key => {
                if (key.endsWith('-name')) {
                  const nameValue = data[key]?.name;
                  if (nameValue && nameValue.trim() !== '') {
                    const parts = key.split('-');
                    if (parts.length >= 3) {
                      const time = parts[0];
                      const col = parseInt(parts[1]);
                      bookings.push({ time, col });
                    }
                  }
                }
              });
              
              if (bookings.length > 0) {
                bookingsByDate[dateKey] = bookings;
              }
            });
            
            webBookings.forEach(booking => {
              const dateKey = booking.date;
              if (!bookingsByDate[dateKey]) {
                bookingsByDate[dateKey] = [];
              }
              bookingsByDate[dateKey].push({
                time: booking.time,
                col: bookingsByDate[dateKey].filter(b => b.time === booking.time).length
              });
            });
            
            console.log('📊 統合後の予約データ:', bookingsByDate);
            setExistingBookings(bookingsByDate);
          } catch (error) {
            console.error('❌ 予約データ読み込みエラー:', error);
            console.error('❌ エラー詳細:', error.message);
          }
        };
        
        loadBookings();
      }, []);

      const getDates = () => {
        const dates = [];
        const start = new Date(currentDate);
        start.setDate(start.getDate() - 3);
        
        for (let i = 0; i < 14; i++) {
          const date = new Date(start);
          date.setDate(start.getDate() + i);
          dates.push(date);
        }
        return dates;
      };

      const getAvailability = (date) => {
        const dateStr = formatDate(date);
        const dayOfWeek = date.getDay();
        
        let timeSlots;
        if (dayOfWeek === 0) {
          timeSlots = BUSINESS_HOURS.sunday;
        } else if (dayOfWeek === 6) {
          timeSlots = BUSINESS_HOURS.saturday;
        } else {
          timeSlots = BUSINESS_HOURS.weekday;
        }
        
        const bookings = existingBookings[dateStr] || [];
        
        return timeSlots.map(time => {
          const bookedCount = bookings.filter(b => b.time === time).length;
          const maxSlots = MAX_SLOTS[time] || 11;
          const available = maxSlots - bookedCount;
          
          return {
            time,
            available: available > 0,
            status: available > 0 ? 'available' : 'full'
          };
        });
      };

      const weekdayTimeSlots = [
        '9:00', '9:45', '10:30', '11:15', '11:45',
        '15:00', '15:45', '16:30', '17:15', '18:00', '18:30', '18:45', '19:30'
      ];
      
      const sundayTimeSlots = [
        '8:30', '9:15', '10:00', '10:45', '11:30', '12:15',
        '13:00', '13:45', '14:30', '15:15', '16:00'
      ];

      const dates = getDates();
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const handleSlotClick = (date, time, available) => {
        if (!available || date < today) return;
        
        setSelectedSlot({ date, time });
        
        console.log('🔍 handleSlotClick - formData:', formData);
        console.log('🔍 handleSlotClick - customerId:', formData.customerId);
        console.log('🔍 handleSlotClick - name:', formData.name);
        
        // 既にログイン済み（customerIdがある）なら直接予約フォームへ
        if (formData.customerId && formData.name) {
          console.log('✅ 既にログイン済み - 予約フォームを表示');
          setShowLoginStep(false);
          setShowForm(true);
        } else {
          console.log('⚠️ ログインしていない - ログインステップを表示');
          // ログインしていない場合はログインステップを表示
          setShowLoginStep(true);
          setLoginChoice(null);
          setShowLoginForm(false);
          setShowPasswordSetup(false);
          setPasswordConfirm('');
          setShowForm(false);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        try {
          const customerDoc = await db.collection('customers').doc(formData.customerId).get();
          
          let result;
          if (!customerDoc.exists) {
            result = { success: false, message: '顧客IDが見つかりません' };
          } else {
            const customer = customerDoc.data();
            if (customer.password === formData.password) {
              result = { success: true, customer: { id: customerDoc.id, ...customer } };
            } else {
              result = { success: false, message: 'パスワードが一致しません' };
            }
          }
          
          if (result.success) {
            setFormData(prev => ({
              ...prev,
              customerId: result.customer.id,
              name: result.customer.name,
              phone: result.customer.phone,
              email: result.customer.email || ''
            }));
            setShowLoginStep(false);
            setShowForm(true);
            alert('ログインしました！情報が自動入力されています。');
          } else {
            alert('ログインに失敗しました');
          }
        } catch (error) {
          console.error('ログインエラー:', error);
          alert('エラーが発生しました');
        }
      };

      const handleSubmit = async () => {
        console.log('🔵 handleSubmit開始');
        console.log('🔍🔍🔍 formData.customerId:', formData.customerId);
        
        if (!formData.name || (!formData.phone && !formData.email) || !formData.treatment) {
          alert('お名前、連絡先（電話番号またはメールアドレス）、施術内容を入力してください');
          return;
        }

        // メールアドレス必須チェック（メール認証のため）
        if (!formData.email) {
          alert('メール認証のため、メールアドレスの入力が必須です');
          return;
        }

        const selectedMenu = TREATMENT_MENUS.find(m => m.id === formData.treatment);
        
        // 顧客IDとトークン生成
        const customerId = formData.customerId || `WEB_${Date.now()}`;
        const verificationToken = generateVerificationToken();
        
        console.log('🔍 デバッグ開始 ================');
        console.log('🔍 formData:', formData);
        console.log('🔍 formData.customerId:', formData.customerId);
        console.log('🔍 customerId:', customerId);
        console.log('🔍 verificationToken:', verificationToken);
        console.log('🔍 formData.treatment:', formData.treatment);
        console.log('🔍 selectedMenu:', selectedMenu);

                                  const slot = availability.find(s => s.time === wTime);

                  value={formData.name}
                  onChange={(e) => setFormData({...formData, name: e.target.value})}
                  placeholder="山田 太郎"
                />
              </div>

              <div className="form-group">
                <label>電話番号</label>
                <input 
                  type="tel" 
                  value={formData.phone}
                  onChange={(e) => setFormData({...formData, phone: e.target.value})}
                  placeholder="090-1234-5678"
                  readOnly={formData.customerId && formData.phone} 
                  style={formData.customerId && formData.phone ? {backgroundColor: '#f0f0f0', cursor: 'not-allowed'} : {}}
                />
                {formData.customerId && formData.phone && (
                  <small style={{color: '#666', fontSize: '12px'}}>※ログイン済みのため変更できません</small>
                )}
              </div>

              <div className="form-group">
                <label>メールアドレス</label>
                <small style={{color: '#666', fontSize: '12px', marginLeft: '10px'}}>※電話番号またはメールアドレスのどちらか必須</small>
                <input 
                  type="email" 
                  value={formData.email}
                  onChange={(e) => setFormData({...formData, email: e.target.value})}
                  placeholder="example@email.com"
                  readOnly={formData.customerId && formData.email}
                  style={formData.customerId && formData.email ? {backgroundColor: '#f0f0f0', cursor: 'not-allowed'} : {}}
                />
                {formData.customerId && formData.email && (
                  <small style={{color: '#666', fontSize: '12px'}}>※ログイン済みのため変更できません</small>
                )}
              </div>

              <div className="form-group">
                <label>施術メニュー <span style={{color: 'red'}}>*</span></label>
                <select 
                  value={formData.treatment}
                  onChange={(e) => setFormData({...formData, treatment: e.target.value})}
                >
                  <option value="">選択してください</option>
                  {TREATMENT_MENUS
                    .filter(menu => {
                      if (loginChoice === 'new') {
                        return menu.isNewPatient === true;
                      }
                      return menu.isNewPatient !== true;
                    })
                    .map(menu => (
                      <option key={menu.id} value={menu.id}>{menu.name}</option>
                    ))
                  }
                </select>
              </div>

              <div className="button-group">
                <button className="cancel-btn" onClick={handleCancel}>キャンセル</button>
                <button className="submit-btn" onClick={handleSubmit}>予約を確定する</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AvailabilityTable />);
  </script>
</body>
</html>
