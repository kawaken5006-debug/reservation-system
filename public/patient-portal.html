<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ - リハキュア</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    /* ログイン画面 */
    .login-screen { display: block; }
    .login-screen.hidden { display: none; }
    .main-content { display: none; }
    .main-content.active { display: block; }
    
    .login-header { text-align: center; margin-bottom: 30px; }
    .login-header h1 { font-size: 28px; color: #333; margin-bottom: 10px; }
    .login-header p { color: #666; font-size: 14px; }
    
    .login-form { max-width: 400px; margin: 0 auto; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; }
    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
    }
    .form-group input:focus { outline: none; border-color: #667eea; }
    
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 15px;
    }
    .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .btn-secondary { background: #f0f0f0; color: #333; }
    .error-message { color: #f44336; font-size: 14px; margin-top: 10px; text-align: center; }
    
    /* メインコンテンツ */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { color: #333; }
    .user-info { font-size: 14px; color: #666; }
    .logout-btn {
      padding: 8px 16px;
      background: #f0f0f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .tabs {
      display: flex;
      gap: 10px;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 20px;
    }
    .tab {
      padding: 10px 20px;
      border: none;
      background: none;
      color: #666;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab.active { color: #667eea; border-bottom-color: #667eea; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* 診察券 */
    .card-list {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .診察card {
      width: 8cm;
      height: 5cm;
      background: white;
      border: 2px solid #667eea;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .診察card-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 35px;
    }
    .診察card-title { font-size: 12px; font-weight: 600; }
    .診察card-number { font-size: 10px; }
    .診察card-body { padding: 6px; height: calc(5cm - 35px); }
    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-auto-rows: 1fr;
      gap: 0;
      border: 1px solid #ddd;
      height: 100%;
    }
    .stamp-cell {
      border: 0.5px solid #ddd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #999;
      position: relative;
      cursor: default;
      overflow: visible;
    }
    .stamp-cell.stamped {
      background: linear-gradient(135deg, #667eea20, #764ba220);
      color: #667eea;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .stamp-cell.stamped:hover {
      background: linear-gradient(135deg, #667eea30, #764ba230);
    }
    .stamp-cell.stamped.active {
      background: linear-gradient(135deg, #667eea40, #764ba240);
      box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }
    
    /* 日付と時間 */
    .stamp-date {
      transition: transform 0.3s ease;
    }
    .stamp-time {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.9);
      color: white;
      font-size: 11px;
      padding: 6px 2px;
      border-radius: 0 0 4px 4px;
      opacity: 0;
      transform: translateY(-100%);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stamp-cell.stamped.active .stamp-date {
      transform: translateY(-4px);
    }
    .stamp-cell.stamped.active .stamp-time {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* キャンセルボタン */
    .cancel-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ff4444;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.8;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .cancel-btn:hover {
      opacity: 1;
      background: #cc0000;
    }
    
    /* 回数券 */
    .ticket-list {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .ticket-card {
      width: 8cm;
      height: 5cm;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .ticket-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 30px;
    }
    .ticket-name { font-size: 11px; font-weight: 600; }
    .ticket-info { font-size: 8px; display: flex; gap: 8px; }
    .ticket-body { padding: 6px; height: calc(5cm - 30px); }
    
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 1fr;
      gap: 0;
      border: 1px solid #ddd;
      height: 100%;
    }
    .grid-6 {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-auto-rows: 1fr;
      gap: 0;
      border: 1px solid #ddd;
      height: 100%;
    }
    .grid-8 {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-auto-rows: 1fr;
      gap: 0;
      border: 1px solid #ddd;
      height: 100%;
    }
    
    .cell {
      border: 0.5px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1px;
      font-size: 14px;
      font-weight: 600;
    }
    .cell.used { background: #f0f0f0; }
    .no-data { text-align: center; color: #999; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <!-- ログイン画面 -->
    <div id="loginScreen" class="login-screen">
      <div class="login-header">
        <h1>🏥 リハキュア マイページ</h1>
        <p>顧客IDとパスワードでログインしてください</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label>顧客ID</label>
          <input type="text" id="customerId" required>
        </div>
        <div class="form-group">
          <label>パスワード</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary">ログイン</button>
        <div id="errorMessage" class="error-message"></div>
      </form>
    </div>

    <!-- メインコンテンツ -->
    <div id="mainContent" class="main-content">
      <div class="header">
        <div>
          <h2>マイページ</h2>
          <div class="user-info" id="userInfo"></div>
        </div>
        <button class="logout-btn" onclick="logout()">ログアウト</button>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab('cards')">診察券</button>
        <button class="tab" onclick="switchTab('tickets')">回数券</button>
      </div>

      <!-- 診察券タブ -->
      <div class="tab-content active" id="tab-cards">
        <div class="card-list" id="cardList"></div>
      </div>

      <!-- 回数券タブ -->
      <div class="tab-content" id="tab-tickets">
        <div class="ticket-list" id="ticketList"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDNWom7ao2r37n76RaXpPo5vV0DnW-XLtw",
      authDomain: "rihacure.firebaseapp.com",
      projectId: "rihacure",
      storageBucket: "rihacure.firebasestorage.app",
      messagingSenderId: "862106618207",
      appId: "1:862106618207:web:e68f31962e28d893c4d8a3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let currentUser = null;

    // ページ読み込み時にログイン状態を復元
    window.addEventListener('DOMContentLoaded', async () => {
      const savedUserId = localStorage.getItem('patientPortalUserId');
      if (savedUserId) {
        try {
          const customerDoc = await getDoc(doc(db, 'customers', savedUserId));
          if (customerDoc.exists()) {
            currentUser = { id: savedUserId, ...customerDoc.data() };
            
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainContent').classList.add('active');
            document.getElementById('userInfo').textContent = `${currentUser.name} 様（ID: ${currentUser.id}）`;
            
            loadCards();
            loadTickets();
          } else {
            // ユーザーが存在しない場合はクリア
            localStorage.removeItem('patientPortalUserId');
          }
        } catch (error) {
          console.error('自動ログインエラー:', error);
          localStorage.removeItem('patientPortalUserId');
        }
      }
    });

    // ログイン処理
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const customerId = document.getElementById('customerId').value.trim();
      const password = document.getElementById('password').value;

      try {
        const customerDoc = await getDoc(doc(db, 'customers', customerId));
        
        if (!customerDoc.exists()) {
          showError('顧客IDが見つかりません');
          return;
        }

        const customerData = customerDoc.data();

        if (customerData.password !== password) {
          showError('パスワードが正しくありません');
          return;
        }

        currentUser = { id: customerId, ...customerData };
        
        // ログイン状態を保存
        localStorage.setItem('patientPortalUserId', customerId);
        
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.add('active');
        document.getElementById('userInfo').textContent = `${currentUser.name} 様（ID: ${currentUser.id}）`;
        
        loadCards();
        loadTickets();
        
      } catch (error) {
        console.error('ログインエラー:', error);
        showError('エラーが発生しました');
      }
    });

    function showError(message) {
      document.getElementById('errorMessage').textContent = message;
    }

    window.logout = function() {
      currentUser = null;
      localStorage.removeItem('patientPortalUserId');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('mainContent').classList.remove('active');
      document.getElementById('loginForm').reset();
      document.getElementById('errorMessage').textContent = '';
    }
    
    // デバッグ関数
    window.debugReservations = async function() {
      const { collection, getDocs } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
      const snapshot = await getDocs(collection(db, 'reservations'));
      const doc2026 = Array.from(snapshot.docs).find(d => d.id.startsWith('2026-01'));
      if (doc2026) {
        console.log('📅 日付:', doc2026.id);
        const data = doc2026.data();
        const keys = Object.keys(data);
        console.log('🔑 全キー数:', keys.length);
        console.log('🔑 最初の20キー:', keys.slice(0, 20));
        
        // memoTextsを確認
        if (data.memoTexts) {
          console.log('📝 memoTexts:', data.memoTexts);
        }
        
        // nameキーを確認
        const nameKeys = keys.filter(k => k.includes('name'));
        console.log('👤 nameキー:', nameKeys.slice(0, 5));
        nameKeys.slice(0, 3).forEach(k => {
          console.log(`  ${k}:`, data[k]);
        });
      }
    }

    window.switchTab = function(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');
    }
    
    // 時間表示のトグル
    window.toggleTime = function(element, event) {
      event.stopPropagation();
      
      // 他のアクティブなセルを閉じる
      document.querySelectorAll('.stamp-cell.active').forEach(cell => {
        if (cell !== element) {
          cell.classList.remove('active');
        }
      });
      
      // このセルをトグル
      element.classList.toggle('active');
    }

    // 診察券読み込み
    async function loadCards() {
      const cardList = document.getElementById('cardList');
      
      console.log('🔍 診察券読み込み開始');
      console.log('👤 currentUser:', currentUser);
      console.log('🆔 currentUser.id:', currentUser.id, typeof currentUser.id);
      console.log('📛 currentUser.name:', currentUser.name);
      
      try {
        // Firestoreのreservationsから顧客の予約を取得
        const { collection, getDocs } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
        
        const reservationsRef = collection(db, 'reservations');
        const snapshot = await getDocs(reservationsRef);
        
        console.log('📊 取得したドキュメント数:', snapshot.size);
        
        const visits = [];
        const visitTimes = {}; // 日付ごとの時間を保存
        
        // 全日付の予約データから顧客IDに一致するものを抽出
        snapshot.forEach((docSnapshot) => {
          const dateData = docSnapshot.data();
          const dateKey = docSnapshot.id; // 例: "2026-01-16"
          
          // 2026-01-16を詳細デバッグ
          if (dateKey === '2026-01-16') {
            console.log(`🔍 詳細デバッグ: ${dateKey}`);
            const allKeys = Object.keys(dateData);
            console.log(`  全キー数: ${allKeys.length}件`);
            console.log(`  全キー:`, allKeys);
            
            // dataキーの中身を確認
            if (dateData.data) {
              console.log(`  📦 data内のキー:`, Object.keys(dateData.data).slice(0, 30));
              const dataKeys = Object.keys(dateData.data);
              const idKeys = dataKeys.filter(k => k.endsWith('-id'));
              const nameKeys = dataKeys.filter(k => k.endsWith('-name'));
              console.log(`  IDキー: ${idKeys.length}件`, idKeys.slice(0, 5));
              console.log(`  nameキー: ${nameKeys.length}件`, nameKeys.slice(0, 5));
              
              if (idKeys.length > 0) {
                console.log(`    ${idKeys[0]}:`, dateData.data[idKeys[0]]);
              }
              if (nameKeys.length > 0) {
                console.log(`    ${nameKeys[0]}:`, dateData.data[nameKeys[0]]);
              }
            }
          }
          
          // その日の予約データを取得（dataキーの中にある）
          const dayData = dateData.data || {};
          
          // その日の全予約枠をチェック
          Object.keys(dayData).forEach(key => {
            // IDを確認: "9:00-0-id" の値は {id: "10"}
            if (key.endsWith('-id')) {
              const idObj = dayData[key];
              if (typeof idObj === 'object' && idObj?.id === currentUser.id) {
                console.log(`✅ ID一致！日付追加: ${dateKey} (${key}: ${idObj.id})`);
                if (!visits.includes(dateKey)) {
                  visits.push(dateKey);
                  // 時間を抽出: "9:00-0-id" → "9:00"
                  const timeMatch = key.match(/^(\d{1,2}:\d{2})-/);
                  if (timeMatch) {
                    if (!visitTimes[dateKey]) visitTimes[dateKey] = [];
                    visitTimes[dateKey].push(timeMatch[1]);
                  }
                }
              }
            }
            
            // 名前を確認: "9:00-0-name" の値は {name: "古藤 宗利"}
            if (key.endsWith('-name')) {
              const nameObj = dayData[key];
              if (typeof nameObj === 'object' && nameObj?.name) {
                // 空白を正規化して比較（全角スペース・半角スペース対応）
                const normalizedName = nameObj.name.replace(/\s+/g, '');
                const normalizedUserName = currentUser.name.replace(/\s+/g, '');
                
                if (dateKey === '2026-01-16') {
                  console.log(`👤 ${key}: 名前="${nameObj.name}" (正規化:${normalizedName}) vs "${currentUser.name}" (正規化:${normalizedUserName}) 一致:${normalizedName === normalizedUserName}`);
                }
                
                if (normalizedName === normalizedUserName) {
                  console.log(`✅ 名前一致！日付追加: ${dateKey}`);
                  if (!visits.includes(dateKey)) {
                    visits.push(dateKey);
                    // 時間を抽出
                    const timeMatch = key.match(/^(\d{1,2}:\d{2})-/);
                    if (timeMatch) {
                      if (!visitTimes[dateKey]) visitTimes[dateKey] = [];
                      visitTimes[dateKey].push(timeMatch[1]);
                    }
                  }
                }
              }
            }
          });
        });
        
        // 日付でソート
        visits.sort();
        
        console.log('📅 最終的な予約日付:', visits);
        
        // 24枠ごとに診察券を分割
        const cardsNeeded = Math.ceil(visits.length / 24) || 1;
        
        let html = '';
        for (let cardNum = 0; cardNum < cardsNeeded; cardNum++) {
          const startIndex = cardNum * 24;
          const endIndex = Math.min(startIndex + 24, visits.length);
          const cardVisits = visits.slice(startIndex, endIndex);
          
          html += `
            <div class="診察card">
              <div class="診察card-header">
                <div class="診察card-title">診察券 ${cardNum + 1}</div>
                <div class="診察card-number">${cardVisits.length}/24</div>
              </div>
              <div class="診察card-body">
                <div class="stamp-grid">
          `;
          
          for (let i = 0; i < 24; i++) {
            if (i < cardVisits.length) {
              const dateStr = cardVisits[i]; // "2026-01-16"
              const [year, month, day] = dateStr.split('-');
              const times = visitTimes[dateStr] || [];
              const timeText = times.join(', ') || '時間不明';
              
              // キャンセル可能かチェック（24時間前まで）
              const visitDate = new Date(dateStr + 'T' + times[0] + ':00');
              const now = new Date();
              const hoursDiff = (visitDate - now) / (1000 * 60 * 60);
              const canCancel = hoursDiff > 24;
              
              html += `
                <div class="stamp-cell stamped" onclick="toggleTime(this, event)" data-date="${dateStr}" data-times="${times.join(',')}">
                  <div class="stamp-date">${parseInt(month)}/${parseInt(day)}</div>
                  <div class="stamp-time">${timeText}</div>
                  ${canCancel ? `<button class="cancel-btn" onclick="cancelReservation('${dateStr}', '${times[0]}', event)" title="キャンセル">×</button>` : ''}
                </div>`;
            } else {
              html += `<div class="stamp-cell">${i + 1}</div>`;
            }
          }
          
          html += `
                </div>
              </div>
            </div>
          `;
        }
        
        cardList.innerHTML = html || '<div class="no-data">予約がありません</div>';
        
      } catch (error) {
        console.error('診察券読み込みエラー:', error);
        cardList.innerHTML = '<div class="no-data">診察券の読み込みに失敗しました</div>';
      }
    }

    // 回数券読み込み
    function loadTickets() {
      const ticketList = document.getElementById('ticketList');
      const tickets = currentUser.tickets || [];
      
      if (tickets.length === 0) {
        ticketList.innerHTML = '<div class="no-data">回数券がありません</div>';
        return;
      }
      
      let html = '';
      tickets.slice(0, 3).forEach(ticket => {
        const usedCount = ticket.used?.length || 0;
        const remaining = ticket.count - usedCount;
        
        // 列数を決定
        let gridClass = 'grid-4';
        if (ticket.count > 30) gridClass = 'grid-8';
        else if (ticket.count > 16) gridClass = 'grid-6';
        
        html += `
          <div class="ticket-card">
            <div class="ticket-header">
              <div class="ticket-name">${ticket.name} ${ticket.count}回券</div>
              <div class="ticket-info">
                <span>残り:${remaining}回</span>
                <span>使用済み:${usedCount}回</span>
              </div>
            </div>
            <div class="ticket-body">
              <div class="${gridClass}">
        `;
        
        for (let i = 0; i < ticket.count; i++) {
          if (i < usedCount && ticket.used[i]) {
            const date = new Date(ticket.used[i]);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            html += `<div class="cell used">${month}/${day}</div>`;
          } else {
            html += `<div class="cell">${i + 1}</div>`;
          }
        }
        
        html += `
              </div>
            </div>
          </div>
        `;
      });
      
      ticketList.innerHTML = html;
    }
    
    // 予約キャンセル機能
    window.cancelReservation = async function(dateStr, timeStr, event) {
      event.stopPropagation(); // toggleTimeが発火しないように
      
      if (!confirm(`${dateStr} ${timeStr}の予約をキャンセルしますか？`)) {
        return;
      }
      
      try {
        const { collection, doc, getDoc, updateDoc, deleteField } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
        
        // Firestoreから該当の予約を削除
        const reservationRef = doc(db, 'reservations', dateStr);
        const reservationDoc = await getDoc(reservationRef);
        
        if (!reservationDoc.exists()) {
          alert('予約データが見つかりませんでした');
          return;
        }
        
        const data = reservationDoc.data();
        const dayData = data.data || {};
        
        // 該当時間の予約を探して削除
        const updates = {};
        Object.keys(dayData).forEach(key => {
          if (key.startsWith(timeStr)) {
            const idKey = key.endsWith('-id') ? key : `${key}-id`;
            const nameKey = key.endsWith('-name') ? key : key.replace('-id', '-name');
            
            // このキーが現在のユーザーの予約か確認
            if (dayData[idKey]?.id == currentUser.id) {
              updates[`data.${idKey}`] = deleteField();
              updates[`data.${nameKey}`] = deleteField();
            }
          }
        });
        
        if (Object.keys(updates).length === 0) {
          alert('該当する予約が見つかりませんでした');
          return;
        }
        
        // Firestoreを更新
        await updateDoc(reservationRef, updates);
        
        alert('予約をキャンセルしました');
        
        // 診察券を再読み込み
        await loadCards();
        
      } catch (error) {
        console.error('キャンセルエラー:', error);
        alert('キャンセルに失敗しました: ' + error.message);
      }
    }
  </script>
</body>
</html>
